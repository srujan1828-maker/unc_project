name: OmniSync checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web-and-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v6
        with:
          name: omnisync-service-and-web
          path: |
            dist/
            server/
            tools/omni.js
            tools/recover-owner.js
            package.json
            package-lock.json
            README.md
            docs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build apps/windows/OmniSync.csproj -c Release
      - run: dotnet publish apps/windows/OmniSync.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v6
        with:
          name: omnisync-windows-x64-development
          path: artifacts/windows/
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/test-macos.js
      - run: bash apps/macos/build-app.sh --universal
      - run: bash apps/macos/scripts/smoke-test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: omnisync-macos-universal-development
          path: |
            apps/macos/build/OmniSync-macos-universal.zip
            apps/macos/build/OmniSync-macos-universal.dmg
            apps/macos/build/SHA256SUMS
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug lintDebug --no-daemon --max-workers=2
        working-directory: apps/android
      - uses: actions/upload-artifact@v6
        with:
          name: omnisync-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
  linux-gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 libsecret-tools xvfb
      - run: npm ci
      - run: xvfb-run -a node tools/test-gtk.js
      - uses: actions/upload-artifact@v6
        with:
          name: omnisync-linux-companion
          path: |
            apps/linux/
            docs/NATIVE_CLIENTS.md
          if-no-files-found: error
